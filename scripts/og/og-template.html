<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 78% 8%, rgba(208,169,90,0.14) 0%, rgba(208,169,90,0) 42%),
      radial-gradient(110% 80% at 12% 108%, rgba(184,61,45,0.10) 0%, rgba(184,61,45,0) 46%),
      #0B0913;
    color: #F4ECD7;
    font-family: 'Noto Sans SC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 星点 */
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; border-radius: 50%;
    background: #F4ECD7; opacity: 0.55;
    box-shadow: 0 0 6px rgba(244,236,215,0.7);
  }
  /* 北斗七星连线 */
  .dipper { position: absolute; top: 74px; right: 96px; width: 320px; height: 220px; opacity: 0.9; }
  .content {
    position: absolute; left: 96px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    width: 720px;
  }
  .brand-row { display: flex; align-items: baseline; gap: 18px; margin-bottom: 30px; }
  .brand-en {
    font-family: 'Noto Serif SC', serif; font-weight: 500;
    font-size: 34px; letter-spacing: 6px; color: #D0A95A;
  }
  .brand-dot { color: #97762C; font-size: 28px; }
  .brand-cn {
    font-family: 'Noto Serif SC', serif; font-weight: 600;
    font-size: 40px; letter-spacing: 10px; color: #F4ECD7;
  }
  .hook {
    font-family: 'Noto Serif SC', serif; font-weight: 700;
    font-size: 66px; line-height: 1.3; letter-spacing: 3px;
    color: #F4ECD7;
  }
  .hook .accent { color: #E2C879; }
  .sub {
    margin-top: 34px; font-size: 25px; line-height: 1.7;
    font-weight: 300; color: #BEB29A; letter-spacing: 1px;
  }
  .tags { margin-top: 46px; display: flex; gap: 14px; }
  .tag {
    font-size: 20px; letter-spacing: 3px; color: #D0A95A;
    padding: 9px 20px; border: 1px solid rgba(208,169,90,0.40);
    border-radius: 999px; font-weight: 400;
  }
  .hairline {
    position: absolute; left: 96px; right: 96px; bottom: 56px;
    height: 1px; background: rgba(244,236,215,0.10);
  }
  .foot {
    position: absolute; left: 96px; bottom: 30px;
    font-size: 19px; letter-spacing: 2px; color: #847A67;
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <svg class="dipper" viewBox="0 0 320 220">
    <polyline points="20,40 78,58 132,44 176,86 236,96 262,150 208,178"
      fill="none" stroke="rgba(208,169,90,0.45)" stroke-width="1.5"/>
    <g fill="#E2C879">
      <circle cx="20" cy="40" r="4.5"/><circle cx="78" cy="58" r="4"/>
      <circle cx="132" cy="44" r="4"/><circle cx="176" cy="86" r="4.5"/>
      <circle cx="236" cy="96" r="4"/><circle cx="262" cy="150" r="5"/>
      <circle cx="208" cy="178" r="4.5"/>
    </g>
  </svg>
  <div class="content">
    <div class="brand-row">
      <span class="brand-en">MINGLI</span>
      <span class="brand-dot">·</span>
      <span class="brand-cn">命理</span>
    </div>
    <div class="hook">把命盘翻译成<br>今天可以做的<br><span class="accent">一个选择</span>。</div>
    <div class="sub">紫微 × 八字，不算命，只把你的盘落到今天该怎么走。</div>
    <div class="tags">
      <span class="tag">每日一题</span>
      <span class="tag">人生排盘</span>
      <span class="tag">紫灵牌问事</span>
    </div>
  </div>
  <div class="hairline"></div>
  <div class="foot">给漂在外面的你 · 中文命理</div>
  <script>
    // 随机星点，避免撞在文字区
    const box = document.getElementById('stars');
    const rand = (a,b)=>a+Math.random()*(b-a);
    for (let i=0;i<70;i++){
      const s=document.createElement('div'); s.className='star';
      const size=rand(1,2.6);
      s.style.width=size+'px'; s.style.height=size+'px';
      s.style.left=rand(0,1200)+'px'; s.style.top=rand(0,630)+'px';
      s.style.opacity=rand(0.15,0.65);
      box.appendChild(s);
    }
  </script>
</body>
</html>
